name: validate

on:
  push:
    branches: [master, main]
  pull_request:

env:
  # Bump deliberately: this also rolls the cache key below.
  TYPST_VERSION: 0.15.1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo / typst-cli
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/typst
            ~/.cargo/registry
          key: ${{ runner.os }}-typst-cli-${{ env.TYPST_VERSION }}

      - name: Install Typst CLI (if not cached)
        run: |
          if ! command -v typst >/dev/null; then
            cargo install --locked typst-cli --version "$TYPST_VERSION"
          fi
          typst --version

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Validate SKILL.md frontmatter
        run: |
          set -e
          for skill in skills/*/SKILL.md; do
            name=$(basename "$(dirname "$skill")")
            if ! head -20 "$skill" | grep -Fx "name: $name" >/dev/null; then
              echo "::error file=$skill::frontmatter name must match directory name '$name'"
              exit 1
            fi
            head -20 "$skill" | grep -E '^description: ' >/dev/null
            head -20 "$skill" | grep -E '^allowed-tools: ' >/dev/null
          done
          echo "SKILL.md frontmatter OK"

      - name: Validate plugin.json
        run: |
          python3 -c "import json,os; n=json.load(open('.claude-plugin/plugin.json'))['name']; assert os.path.isfile(f'skills/{n}/SKILL.md'), f'no skills/{n}/SKILL.md for plugin name {n}'; print('plugin.json OK')"

      - name: Validate marketplace.json
        run: |
          python3 -c "import json; m=json.load(open('.claude-plugin/marketplace.json')); n=json.load(open('.claude-plugin/plugin.json'))['name']; assert n in [p['name'] for p in m.get('plugins',[])], f'plugin {n} not listed in marketplace.json'; print('marketplace.json OK')"

      - name: Compile every example
        run: |
          set -e
          mkdir -p /tmp/typst-out
          for f in skills/chanmeng-typst/examples/*.typ; do
            echo "compiling $f"
            typst compile "$f" "/tmp/typst-out/$(basename "$f" .typ).pdf"
          done
          ls -la /tmp/typst-out

      - name: Compile every template in the references
        run: python3 .github/scripts/compile-templates.py

      - name: Check the ATS example with check-pdf.py
        run: |
          python3 skills/chanmeng-typst/scripts/check-pdf.py /tmp/typst-out/resume-ats.pdf \
            --source skills/chanmeng-typst/examples/resume-ats.typ \
            --ats --pages 1 \
            --require "Alex Rivera" "alex.rivera@example.com" "multi-tenant" "open-source" "~35%"

      - name: Run verify-typst.sh
        run: bash skills/chanmeng-typst/scripts/verify-typst.sh
